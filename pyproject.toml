[project]
name = "agent-project"
version = "0.2.0"
description = "The Project Agent: builds and changes Pipelines by calling tools"
readme = "README.md"
authors = [
    { name = "Steve Sperandeo", email = "steve.sperandeo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "openai>=2.53.0",
]

[project.scripts]
agent-project = "agent_project:main"
agent-project-serve = "agent_project:serve"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
